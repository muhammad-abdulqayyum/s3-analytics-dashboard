services:
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  backend:
    build: ./backend
    ports: ["127.0.0.1:8080:8080"]
    environment:
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: demo
      APP_USERNAME: ${APP_USERNAME:-demo}
      APP_PASSWORD: ${APP_PASSWORD:-demo-change-me}
    depends_on:
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on: [backend]
